services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pipeline_sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-pipeline_sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline_sentinel_demo}
    ports:
      - "5433:5432"
    volumes:
      - pipeline-sentinel-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      PIPELINE_SENTINEL_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pipeline_sentinel}
      PIPELINE_SENTINEL_DB_USERNAME: ${POSTGRES_USER:-pipeline_sentinel}
      PIPELINE_SENTINEL_DB_PASSWORD: ${POSTGRES_PASSWORD:-pipeline_sentinel_demo}
      PIPELINE_SENTINEL_CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8081}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8081}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pipeline-sentinel-postgres-data:
